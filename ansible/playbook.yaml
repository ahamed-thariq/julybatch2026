---
- hosts: webservers
  become: true
  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Start Apache service
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Copy HTML file to Apache web root
      copy:
        src: /etc/ansible/index.html
        dest: /var/www/html/index.html
        mode: '0644'